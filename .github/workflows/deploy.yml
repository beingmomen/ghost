name: Deploy via Coolify

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      db: ${{ steps.filter.outputs.db }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
              - 'pnpm-lock.yaml'
            db:
              - 'apps/db/**'
              - 'pnpm-lock.yaml'
            server:
              - 'apps/server/**'
              - 'pnpm-lock.yaml'

  # Order: server (lightweight Node) → db (Nuxt, heavy) → client (Nuxt, heavy)
  # Each job waits for Coolify to finish before the next starts, so concurrent
  # Nuxt builds never run on the VPS (each needs ~4GB RAM).

  deploy-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy elshatory-api
        uses: ./.github/actions/coolify-deploy
        with:
          uuid: u1180x2bduzvavpdq8suq4tm
          base_url: ${{ secrets.COOLIFY_BASE_URL }}
          token: ${{ secrets.COOLIFY_TOKEN }}

  deploy-db:
    needs: [detect-changes, deploy-server]
    if: |
      always() &&
      needs.detect-changes.outputs.db == 'true' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy elshatory-db
        uses: ./.github/actions/coolify-deploy
        with:
          uuid: hf5pu8txoa6tkkjqhzegjlrm
          base_url: ${{ secrets.COOLIFY_BASE_URL }}
          token: ${{ secrets.COOLIFY_TOKEN }}

  deploy-client:
    needs: [detect-changes, deploy-db]
    if: |
      always() &&
      needs.detect-changes.outputs.client == 'true' &&
      (needs.deploy-db.result == 'success' || needs.deploy-db.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy elshatory-web
        uses: ./.github/actions/coolify-deploy
        with:
          uuid: q6fhf875uc3gkeufyhm65t6e
          base_url: ${{ secrets.COOLIFY_BASE_URL }}
          token: ${{ secrets.COOLIFY_TOKEN }}
