name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once — the VPS builds sequentially to protect RAM.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - name: Sync repo on server
        run: |
          cd /root/ghost
          git fetch origin main
          git reset --hard origin/main

      - name: Write env files from repository variables
        env:
          CLIENT_ENV: ${{ vars.CLIENT_ENV_PROD }}
          SERVER_ENV: ${{ vars.SERVER_ENV_PROD }}
          DB_ENV: ${{ vars.DB_ENV_PROD }}
        run: |
          # Strip CR: the *_ENV_PROD repo variables may hold CRLF line endings,
          # which would leave a trailing '\r' on every value (e.g. BASE_URL,
          # SITE_URL). A '\r' in BASE_URL breaks server-side URL building — the
          # /projects SSR fetch dropped its path and 404'd. `tr -d '\r'` yields
          # clean LF .env files.
          printf '%s' "$CLIENT_ENV" | tr -d '\r' > /root/ghost/apps/client/.env
          printf '%s' "$SERVER_ENV" | tr -d '\r' > /root/ghost/apps/server/.env
          printf '%s' "$DB_ENV"     | tr -d '\r' > /root/ghost/apps/db/.env

      - name: Build & restart changed apps
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: bash /root/ghost/scripts/deploy.sh
