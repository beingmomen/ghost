name: Deploy

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      client: ${{ steps.filter.outputs.client }}
      db: ${{ steps.filter.outputs.db }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'apps/client/**'
            db:
              - 'apps/db/**'
            server:
              - 'apps/server/**'

  deploy-client:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.client == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - run: pnpm install
      - run: pnpm --filter client build
      - run: pm2 restart client

  deploy-db:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.db == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - run: pnpm install
      - run: pnpm --filter db build
      - run: pm2 restart db

  deploy-server:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - run: pnpm install
      - run: pnpm --filter server build
      - run: pm2 restart server
