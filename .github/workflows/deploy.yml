name: Deploy to VPS

# Deploys beingmomen.com, api.beingmomen.com, and db.beingmomen.com (ghost monorepo)
# to vps-jeddah-1 (130.110.102.134) under site user ghost-web using the G5 release layout.
# Code is synced over SSH with a scoped deploy key, Nuxt client and db built on ARM64 under nice,
# current symlink flipped atomically, and PM2 reloaded. Last 3 releases kept.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ghost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' | sed $'s/^\xEF\xBB\xBF//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          VPS_HOST=$(echo "${{ secrets.VPS_HOST }}" | tr -d '[:space:]' | sed $'s/^\xEF\xBB\xBF//')
          VPS_USER=$(echo "${{ secrets.VPS_USER }}" | tr -d '[:space:]' | sed $'s/^\xEF\xBB\xBF//')
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "VPS_USER=$VPS_USER" >> "$GITHUB_ENV"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Rsync code to server
        run: |
          REL="releases/$(date +%Y%m%d%H%M%S)"
          echo "REL=$REL" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "mkdir -p $REL"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.output' \
            --exclude='.nuxt' \
            --exclude='apps/*/.env' \
            --exclude='/.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:$REL/"

      - name: Remote build and switch
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "bash -s" <<REMOTE
          set -euo pipefail
          export PATH="\$HOME/.nvm/versions/node/v24.22.2/bin:\$PATH"
          cd "\$HOME/$REL"
          # Symlink shared env files
          ln -sfn "\$HOME/shared/client.env" "\$HOME/$REL/apps/client/.env"
          ln -sfn "\$HOME/shared/server.env" "\$HOME/$REL/apps/server/.env"
          ln -sfn "\$HOME/shared/db.env" "\$HOME/$REL/apps/db/.env"
          # Export GIGET_AUTH for apps/db base-layer fetch
          set -a; . "\$HOME/shared/db.env"; set +a
          # Install dependencies
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm install --frozen-lockfile
          # Build client and db under nice sequentially (Express server has no build step)
          cd "\$HOME/$REL/apps/client"
          NODE_OPTIONS=--max-old-space-size=4096 nice -n 10 pnpm build
          cd "\$HOME/$REL/apps/db"
          NODE_OPTIONS=--max-old-space-size=4096 nice -n 10 pnpm build
          # Switch current symlink atomically
          ln -sfn "\$HOME/$REL" "\$HOME/current"
          # Reload PM2 apps from the persistent ecosystem config
          pm2 reload "\$HOME/ecosystem.config.cjs" --update-env
          pm2 save
          # Retain only last 3 releases
          cd "\$HOME/releases"
          ls -dt 20* | tail -n +4 | xargs -r rm -rf
          REMOTE

      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' -L https://beingmomen.com/)
          api=$(curl -s -o /dev/null -w '%{http_code}' https://api.beingmomen.com/api/v1/landing)
          db=$(curl -s -o /dev/null -w '%{http_code}' -L https://db.beingmomen.com/)
          echo "site=$code api=$api db=$db"
          test "$code" = "200"
          test "$api" = "200"
          test "$db" = "200"
