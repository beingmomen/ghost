name: Coolify Deploy
description: Trigger a Coolify deployment and wait until it finishes.

inputs:
  uuid:
    description: Coolify application UUID
    required: true
  base_url:
    description: Coolify base URL (e.g. https://coolify.example.com)
    required: true
  token:
    description: Coolify API bearer token
    required: true
  timeout_minutes:
    description: How long to wait for the deployment before failing
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Trigger deployment
      id: trigger
      shell: bash
      env:
        COOLIFY_BASE_URL: ${{ inputs.base_url }}
        COOLIFY_TOKEN: ${{ inputs.token }}
        APP_UUID: ${{ inputs.uuid }}
      run: |
        response=$(curl -sS -X GET \
          "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$APP_UUID&force=false" \
          -H "Authorization: Bearer $COOLIFY_TOKEN")
        echo "Coolify response: $response"
        deployment_uuid=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['deployments'][0]['deployment_uuid'])")
        if [ -z "$deployment_uuid" ]; then
          echo "::error::Failed to extract deployment_uuid from Coolify response"
          exit 1
        fi
        echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
        echo "Triggered deployment: $deployment_uuid"

    - name: Wait for deployment to finish
      shell: bash
      env:
        COOLIFY_BASE_URL: ${{ inputs.base_url }}
        COOLIFY_TOKEN: ${{ inputs.token }}
        DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      run: |
        deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
        while true; do
          if [ "$(date +%s)" -gt "$deadline" ]; then
            echo "::error::Timed out after ${TIMEOUT_MINUTES} minutes waiting for $DEPLOYMENT_UUID"
            exit 1
          fi
          status=$(curl -sS -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_BASE_URL/api/v1/deployments/$DEPLOYMENT_UUID" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
          echo "[$(date +%H:%M:%S)] status=$status"
          case "$status" in
            finished)
              echo "Deployment succeeded."
              exit 0
              ;;
            failed|cancelled-by-user)
              echo "::error::Deployment ended with status: $status"
              exit 1
              ;;
            *)
              sleep 15
              ;;
          esac
        done
