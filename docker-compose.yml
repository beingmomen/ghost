services:
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "${CLIENT_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      BASE_URL: ${BASE_URL}
      SITE_URL: ${SITE_URL}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      LOGO: ${LOGO}
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${SERVER_PORT:-1234}:1234"
    environment:
      NODE_ENV: production
      PORT: 1234
      APP_NAME: ${APP_NAME}
      DATABASE_ATLAS: ${DATABASE_ATLAS}
      FRONTEND_URL: ${FRONTEND_URL}
      FRONTEND_RESET_PASSWORD_URL: ${FRONTEND_RESET_PASSWORD_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN}
      EMAIL_FROM: ${EMAIL_FROM}
      STAMP_MAIL: ${STAMP_MAIL}
      STAMP_PASSWORD: ${STAMP_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET}
      MANAGER: ${MANAGER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_RATE_LIMIT_MS: ${GEMINI_RATE_LIMIT_MS:-2000}
      LINKEDIN_SOURCE_MODE: ${LINKEDIN_SOURCE_MODE:-disabled}
      LINKEDIN_AUTOFETCH_ENABLED: ${LINKEDIN_AUTOFETCH_ENABLED:-false}
      JOB_FETCHER_TIMEOUT_MS: ${JOB_FETCHER_TIMEOUT_MS:-180000}
      WUZZUF_MAX_PAGES: ${WUZZUF_MAX_PAGES:-3}
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: apps/db/Dockerfile
      args:
        GIGET_AUTH: ${GIGET_AUTH}
    ports:
      - "${DB_PORT:-9123}:3000"
    environment:
      NODE_ENV: production
      NUXT_API_BASE: ${NUXT_API_BASE}
      NUXT_BACKEND_BASE_URL: ${NUXT_BACKEND_BASE_URL}
      AUTH_ORIGIN: ${AUTH_ORIGIN}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
    restart: unless-stopped
